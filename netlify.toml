[build]
  functions = "dist/functions"
  command = "pnpm run build"
  publish = "dist"
  ignore = "false"

# Function-specific configurations
# Note: Scheduled functions removed - GitHub Actions now handles scheduling
[functions."sync-jobs"]
  # Webhook receiver function - no schedule needed

[functions."health-check"]
  # Health monitoring function

[functions."manual-trigger"]
  # Manual GitHub Actions trigger function

# Redirects and routing
[[redirects]]
  from = "/api/jobs"
  to = "/.netlify/functions/sync-jobs"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health-check"
  status = 200

[[redirects]]
  from = "/api/trigger"
  to = "/.netlify/functions/manual-trigger"
  status = 200

# Legacy redirect for backward compatibility
[[redirects]]
  from = "/api/jobs/manual"
  to = "/.netlify/functions/manual-trigger"
  status = 200

# Security headers for static responses. Function responses set their own
# headers in code (see securityHeaders in each function). These endpoints are
# server-to-server only, so no CORS grant is made to any browser origin.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "no-store"

# Edge function settings for better performance (none currently used)
# Example edge function configuration:
# [[edge_functions]]
#   path = "/api/*"  
#   function = "auth-check"

# Environment-specific settings
[context.production.environment]
  LOG_LEVEL = "info"
  ENVIRONMENT = "production"

[context.deploy-preview.environment]
  LOG_LEVEL = "debug"
  ENVIRONMENT = "staging"

[context.branch-deploy.environment]
  LOG_LEVEL = "debug"
  ENVIRONMENT = "development"

# Build processing
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = false

[build.processing.images]
  compress = false