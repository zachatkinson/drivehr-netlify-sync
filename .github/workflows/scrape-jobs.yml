name: DriveHR Job Scraper

on:
  schedule:
    # Run every 6 hours at minutes 0 (same as Netlify cron)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual triggering
    inputs:
      force_sync:
        description: 'Force sync even if no changes detected'
        required: false
        default: 'false'
        type: boolean
      allow_empty:
        description: 'Allow a zero-job scrape to pass (use only when the careers page is genuinely empty)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build TypeScript
        run: pnpm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Scrape jobs and generate signed feed
        env:
          DRIVEHR_COMPANY_ID: ${{ secrets.DRIVEHR_COMPANY_ID }}
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ENVIRONMENT: production
          LOG_LEVEL: info
          FORCE_SYNC: ${{ github.event.inputs.force_sync || 'false' }}
          ALLOW_EMPTY_SCRAPE: ${{ github.event.inputs.allow_empty || 'false' }}
        run: pnpm run scrape-and-sync

      - name: Publish feed to job-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -f feed/jobs.json ] || [ ! -f feed/jobs.json.sig ]; then
            echo "No feed generated (zero-job scrape without force sync); skipping publish"
            exit 0
          fi

          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git clone --depth 1 --branch job-data "$REMOTE" feed-repo 2>/dev/null; then
            echo "Checked out existing job-data branch"
          else
            echo "Creating orphan job-data branch"
            mkdir feed-repo
            git -C feed-repo init -b job-data
            git -C feed-repo remote add origin "$REMOTE"
            printf '# DriveHR Job Feed\n\nMachine-generated branch. `jobs.json` is the current job feed;\n`jobs.json.sig` is its HMAC-SHA256 signature. Published by the\nDriveHR Job Scraper workflow; consumed by the WordPress plugin.\n' > feed-repo/README.md
          fi

          cp feed/jobs.json feed/jobs.json.sig feed-repo/

          cd feed-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Feed unchanged; nothing to publish"
          else
            git commit -m "chore(data): update job feed (run ${GITHUB_RUN_ID})"
            git push origin job-data
            echo "Feed published to job-data branch"
          fi

      - name: Upload job data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-jobs-${{ github.run_number }}
          path: |
            logs/
            temp/
            feed/
          retention-days: 7
